name: 'DPC - Dev Multi-Branch Test Builds'

# this is a temporary throwaway workflow generated by CMS chat to queue up more builds
#
# The reusable build workflow is always pulled from dpc-ops@main (not the
# branch this is run from) -- only the code being built changes with the branch.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build_dev:
    strategy:
      fail-fast: false
      matrix:
        run_number: [1, 2, 3]
    uses: ./.github/workflows/docker-build.yml
    with:
      env: dev
    secrets: inherit
